name: Validate public site
on:
  pull_request:
    paths:
      - data/**
      - scripts/**
      - src/**
      - services/likes/**
      - services/site/**
      - package.json
      - package-lock.json
      - cloudflare.config.ts
      - media/**
      - examples/**
      - integrations/**
      - skills/**
      - LICENSE
      - MEDIA-LICENSE.md
      - README.md
      - .github/workflows/validate-ryoshu.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: node --test services/likes/worker.test.mjs
      - run: python scripts/build.py
      - run: python scripts/check.py
      - run: python scripts/check_navigation.py
      - run: npm test
      - run: npm run prepare:cf
