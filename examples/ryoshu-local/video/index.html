<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ryoshu 別のCanvas図解ソース</title><script>if(window.__MOTION_RENDER__){document.documentElement.className='render';}else if(new URLSearchParams(location.search).get('orientation')==='portrait'){window.renderConfig={width:720,height:1280,fps:30};}</script><style>*{box-sizing:border-box}body{margin:0;background:#eef0e7;color:#203b33;font:16px/1.7 system-ui,"Yu Gothic",sans-serif}main{max-width:1280px;margin:auto;padding:24px}canvas{display:block;width:100%;height:auto;background:#f7f7ef;border-radius:10px}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:20px 0}button,a{min-height:44px;padding:9px 14px;color:#24594d;font:inherit}button{border:1px solid #afc2af;background:white;border-radius:6px;cursor:pointer}input{flex:1;min-width:180px}p{font-size:13px}a{display:inline-flex}.render,.render body,.render main{width:100%;height:100%;margin:0;padding:0;max-width:none;overflow:hidden}.render canvas{width:100vw;height:100vh;border-radius:0}.render .controls,.render .info{display:none}</style></head><body><main><canvas id="film" aria-label="Ryoshuの作業の流れを描く別のCanvas図解"></canvas><div class="controls"><button id="play" type="button">再生</button><input id="time" type="range" min="0" max="32" value="0" step="0.1" aria-label="映像の時刻"><output id="clock">0.0 / 32秒</output></div><div class="controls" id="jumps"></div><div class="info"><p>v0.4由来のCanvasによる32秒・無音の別図解です。新しい32秒MP4を作るPython/Pillowソースではありません。架空の原本と今回の実画面を使い、読み取り・候補の確認・CSVの書き出しを描きます。初回準備にはネット接続が必要で、結果と科目は原本と照合する候補です。</p><a href="?orientation=landscape">16:9</a><a href="?orientation=portrait">小画面用の縦配置</a><a href="../index.html">紹介に戻る</a><p id="error" role="alert"></p></div></main><script src="scene.js"></script><script src="controls.js"></script></body></html>
